<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtítulos hebreo</title>
<style>
  :root { --fs-es: 14px; --fs-he: 14px; --bg:#f9f6ef; --fg:#222; --muted:#6b6b6b; --accent:#2f6fdb; --panel:#f0e9dc; --line:#ddd5c4; --btn:#fff; --btnb:#ccc3b0; --err:#c0392b; --interim:#8a8578; }
  body.dark { --bg:#0f1115; --fg:#f2f2f2; --muted:#8a8f98; --accent:#4ea1ff; --panel:#171a21; --line:#262a33; --btn:#232834; --btnb:#333a48; --err:#ff7b7b; --interim:#6d7480; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,Segoe UI,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; flex-direction:column; gap:8px; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); font-size:14px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; }
  .grp { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
  .sep { width:1px; height:24px; background:var(--btnb); }
  .gl { color:var(--muted); font-weight:600; }
  #mic { width:240px; text-overflow:ellipsis; }
  input[type=range] { width:100px; padding:0; }
  #timer { margin-left:auto; color:var(--muted); }
  button { background:var(--btn); color:var(--fg); border:1px solid var(--btnb); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }
  select, input[type=range] { background:var(--btn); color:var(--fg); border:1px solid var(--btnb); border-radius:6px; padding:6px; }
  label { display:flex; align-items:center; gap:6px; color:var(--muted); }
  #status { margin-left:auto; color:var(--muted); text-align:right; }
  #status.err { color:var(--err); }
  main { flex:1; overflow-y:auto; padding:18px 22px 28px; }
  .line { margin-bottom:20px; }
  .tr { font-size:var(--fs-es); line-height:1.3; }
  .tr.pending { color:var(--muted); font-style:italic; }
  .tr.fail { color:var(--err); font-size:calc(var(--fs-es) * .55); }
  .he { font-size:var(--fs-he); color:var(--muted); direction:rtl; text-align:right; margin-top:4px; }
  body.nohe .he { display:none; }
  #interim { color:var(--interim); direction:rtl; text-align:right; font-size:calc(var(--fs-he) * 1.15); min-height:1.4em; }
  #empty { color:var(--muted); font-size:16px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="grp">
      <button id="btnStart" class="primary">Iniciar</button>
      <button id="btnPause" disabled>Pausar</button>
      <button id="btnStop" disabled>Detener</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <label>Micrófono <select id="mic"></select></label>
      <label>Traducir a
        <select id="target"><option value="es">Español</option><option value="en">Inglés</option></select>
      </label>
      <label>Traductor
        <select id="translator"><option value="claude">Claude</option><option value="google">Google</option></select>
      </label>
    </div>
    <span id="status">Listo</span>
  </div>
  <div class="row">
    <div class="grp">
      <span class="gl">Tamaño de letra</span>
      <label>Español <input id="fsEs" type="range" min="8" max="20" value="14"></label>
      <label>Hebreo <input id="fsHe" type="range" min="8" max="20" value="14"></label>
      <label><input id="showHe" type="checkbox" checked> Mostrar hebreo</label>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button id="btnSave">Guardar transcripción</button>
      <button id="btnDark">Modo oscuro</button>
    </div>
    <span id="timer">Audio enviado: 00:00</span>
  </div>
</header>
<main id="main">
  <div id="empty">Tocá "Iniciar" y permití el micrófono. Los subtítulos aparecen acá.</div>
  <div id="lines"></div>
  <div id="interim"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const els = { start:$('btnStart'), pause:$('btnPause'), stop:$('btnStop'), mic:$('mic'), target:$('target'), translator:$('translator'),
  fsEs:$('fsEs'), fsHe:$('fsHe'), dark:$('btnDark'), showHe:$('showHe'), save:$('btnSave'), timer:$('timer'), status:$('status'),
  main:$('main'), lines:$('lines'), interim:$('interim'), empty:$('empty') };

let ws, ctx, stream, node, sentSamples = 0, paused = false, running = false;
const items = new Map();   // id -> {he, tr, trEl, heEl}
const order = [];

const workletSrc = `
class P extends AudioWorkletProcessor {
  constructor(o){ super(); this.r = o.processorOptions.inRate/16000; this.buf=[]; this.pos=0; this.acc=0; this.n=0; }
  process(inputs){
    const ch = inputs[0][0];
    if(!ch) return true;
    for(let i=0;i<ch.length;i++){
      this.acc += ch[i]; this.n++; this.pos += 1;
      if(this.pos >= this.r){ this.buf.push(this.acc/this.n); this.acc=0; this.n=0; this.pos -= this.r; }
    }
    if(this.buf.length >= 1600){
      const out = new Int16Array(this.buf.length);
      for(let i=0;i<this.buf.length;i++){ const s=Math.max(-1,Math.min(1,this.buf[i])); out[i] = s<0 ? s*32768 : s*32767; }
      this.port.postMessage(out.buffer,[out.buffer]);
      this.buf=[];
    }
    return true;
  }
}
registerProcessor('pcm16k', P);`;

function setStatus(msg, isErr=false){ els.status.textContent = msg; els.status.className = isErr ? 'err' : ''; }

async function listMics(){
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
    const prev = els.mic.value;
    els.mic.innerHTML = '';
    devs.forEach((d,i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || ('Micrófono ' + (i+1)); els.mic.appendChild(o); });
    if (prev) els.mic.value = prev;
  } catch(e) {}
}

function fmt(sec){ const m = Math.floor(sec/60), s = Math.floor(sec%60); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function updateTimer(){ els.timer.textContent = 'Audio enviado: ' + fmt(sentSamples/16000); }

function nearBottom(){ return els.main.scrollHeight - els.main.scrollTop - els.main.clientHeight < 80; }
function scrollDown(){ els.main.scrollTop = els.main.scrollHeight; }

function addFinal(id, he){
  els.empty.style.display = 'none';
  const stick = nearBottom();
  const div = document.createElement('div'); div.className = 'line';
  const trEl = document.createElement('div'); trEl.className = 'tr pending'; trEl.textContent = '…';
  const heEl = document.createElement('div'); heEl.className = 'he'; heEl.lang = 'he'; heEl.textContent = he;
  div.append(trEl, heEl); els.lines.appendChild(div);
  items.set(id, { he, tr:'', trEl }); order.push(id);
  if (stick) scrollDown();
}
function setTranslation(id, tr, error){
  const it = items.get(id); if(!it) return;
  const stick = nearBottom();
  if (error) { it.trEl.className = 'tr fail'; it.trEl.textContent = error; }
  else { it.tr = tr; it.trEl.className = 'tr'; it.trEl.textContent = tr; }
  if (stick) scrollDown();
}

function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => ws.send(JSON.stringify({ type:'start', target: els.target.value, translator: els.translator.value }));
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.kind === 'interim') { const stick = nearBottom(); els.interim.textContent = m.he; if (stick) scrollDown(); }
    else if (m.kind === 'final') addFinal(m.id, m.he);
    else if (m.kind === 'translation') setTranslation(m.id, m.tr, m.error);
    else if (m.kind === 'status') setStatus(m.msg);
    else if (m.kind === 'error') { setStatus(m.msg, true); }
  };
  ws.onclose = () => { if (running) setStatus('Conexión cerrada con el servidor', true); };
}

async function start(){
  try {
    const cfg = await (await fetch('/config')).json();
    if (!cfg.deepgram || !(cfg.has_claude || cfg.has_google)) { setStatus('Faltan las API keys en .env (ver README)', true); return; }
  } catch(e) { setStatus('No se pudo contactar al servidor local', true); return; }

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      deviceId: els.mic.value ? { exact: els.mic.value } : undefined,
      channelCount: 1, echoCancellation: false, noiseSuppression: true, autoGainControl: true } });
  } catch(e) { setStatus('No se pudo abrir el micrófono: ' + e.message, true); return; }
  await listMics();

  ctx = new AudioContext();
  const url = URL.createObjectURL(new Blob([workletSrc], { type:'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  const src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, 'pcm16k', { processorOptions: { inRate: ctx.sampleRate } });
  node.port.onmessage = e => {
    if (!paused && ws && ws.readyState === 1) { ws.send(e.data); sentSamples += e.data.byteLength / 2; updateTimer(); }
  };
  const mute = ctx.createGain(); mute.gain.value = 0;
  src.connect(node); node.connect(mute); mute.connect(ctx.destination);

  running = true; paused = false;
  connect();
  els.start.disabled = true; els.pause.disabled = false; els.stop.disabled = false;
  els.pause.textContent = 'Pausar';
  setStatus('Conectando...');
}

function togglePause(){
  if (!running) return;
  paused = !paused;
  ws.send(JSON.stringify({ type: paused ? 'pause' : 'resume' }));
  els.pause.textContent = paused ? 'Reanudar' : 'Pausar';
  setStatus(paused ? 'En pausa (no se envía audio ni se paga)' : 'Escuchando...');
}

function stop(){
  running = false;
  try { ws && ws.close(); } catch(e){}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch(e){}
  try { ctx && ctx.close(); } catch(e){}
  els.start.disabled = false; els.pause.disabled = true; els.stop.disabled = true;
  els.interim.textContent = '';
  setStatus('Detenido');
}

function save(){
  const text = order.map(id => { const it = items.get(id); return it.he + '\n' + it.tr; }).join('\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/plain;charset=utf-8' }));
  const d = new Date(); a.download = 'clase-' + d.toISOString().slice(0,16).replace(/[:T]/g,'-') + '.txt';
  a.click();
}

els.start.onclick = start;
els.pause.onclick = togglePause;
els.stop.onclick = stop;
els.save.onclick = save;
els.fsEs.oninput = () => document.documentElement.style.setProperty('--fs-es', els.fsEs.value + 'px');
els.fsHe.oninput = () => document.documentElement.style.setProperty('--fs-he', els.fsHe.value + 'px');
function setDark(on){
  document.body.classList.toggle('dark', on);
  els.dark.textContent = on ? 'Modo claro' : 'Modo oscuro';
  try { localStorage.setItem('dark', on ? '1' : '0'); } catch(e) {}
}
els.dark.onclick = () => setDark(!document.body.classList.contains('dark'));
try { if (localStorage.getItem('dark') === '1') setDark(true); } catch(e) {}
els.showHe.onchange = () => document.body.classList.toggle('nohe', !els.showHe.checked);
els.target.onchange = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type:'target', target: els.target.value })); };
els.translator.onchange = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type:'translator', translator: els.translator.value })); };
fetch('/config').then(r => r.json()).then(c => {
  els.translator.value = c.translator;
  for (const o of els.translator.options) if (!(o.value === 'claude' ? c.has_claude : c.has_google)) o.disabled = true;
}).catch(() => {});
listMics();
</script>
</body>
</html>
